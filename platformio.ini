[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
lib_deps = 
	madhephaestus/ESP32Servo@^3.2.1
	pololu/VL53L0X@^1.3.1
	mathertel/OneButton@^2.6.2
	adafruit/Adafruit NeoPixel@^1.15.5
